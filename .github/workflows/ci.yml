name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    # Skip CI for automated main -> dev sync PRs (release commits already passed CI on main)
    if: github.event_name != 'pull_request' || github.head_ref != 'main' || github.base_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Binary
        run: npm run build

      - name: Conformance Suite (ADR 0021 — deterministic Stage-1 gates)
        run: npx vitest run tests/semantic-core.test.ts tests/creation-engine-claude.test.ts tests/semantic-conformance.test.ts

      - name: Run Vitest Suite
        run: npm test
