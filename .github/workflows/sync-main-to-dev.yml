name: Sync main to dev

# Opens a pull request from `main` into `dev` after every successful
# semantic-release run on `main`, so `dev` never drifts behind the
# release commits (version bumps, CHANGELOG.md) that CI writes only to `main`.
# Using `workflow_run` (not `push`) means the sync fires even though the
# release commit message carries `[skip ci]`.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open main → dev sync PR
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open sync pull request (main → dev)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch full remote branch refs
          git fetch origin main:refs/remotes/origin/main dev:refs/remotes/origin/dev

          BEHIND_COUNT=$(git rev-list --count origin/dev..origin/main)
          if [ "$BEHIND_COUNT" -eq "0" ]; then
            echo "dev is already up to date with main (0 new commits). No PR needed."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR is already open from main to dev."
            exit 0
          fi

          gh label create "auto-sync" --description "Automated sync PRs" --color "0e8a16" --force 2>/dev/null || true

          gh pr create \
            --base dev \
            --head main \
            --title "chore(auto): sync main → dev after release" \
            --label "auto-sync" \
            --body-file - << 'EOF'
          Automated pull request bringing upstream `main` changes (semantic-release version bumps, `CHANGELOG.md`) back into `dev`.

          Merge this to keep `main` and `dev` in lockstep so `dev` no longer drifts behind release commits. Created by the "Sync main to dev" workflow after the Release workflow completed successfully on `main`.
          EOF