name: Sync main to dev

# After every successful semantic-release run on `main`, this workflow syncs the
# release commits (version bumps, CHANGELOG.md — written only to `main`) back
# into `dev` so the two branches never drift. It opens the sync pull request
# AND merges it immediately — fully automatic, no manual step. Using
# `workflow_run` (not `push`) means the sync fires even though the release
# commit message carries `[skip ci]`.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync main → dev (PR + auto-merge)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync dev with main (open + auto-merge PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch full remote branch refs
          git fetch origin main:refs/remotes/origin/main dev:refs/remotes/origin/dev

          BEHIND_COUNT=$(git rev-list --count origin/dev..origin/main)
          if [ "$BEHIND_COUNT" -eq "0" ]; then
            echo "dev is already up to date with main (0 new commits). Nothing to sync."
            exit 0
          fi

          # 1. Fast path A: Direct fast-forward push (when main is an ancestor of dev)
          echo "Attempting direct fast-forward push of main into dev..."
          if git push origin origin/main:refs/heads/dev 2>/dev/null; then
            echo "dev fast-forwarded directly to main. Lockstep achieved in 1s without PR overhead."
            exit 0
          fi

          # 2. Fast path B: Direct merge & push (handles squash-merged releases where main and dev diverged)
          # With Write role in dev ruleset bypass, we merge main into dev locally and push directly.
          # This completely avoids creating a PR, preventing phantom unapproved CI runs on github-actions[bot].
          echo "Direct fast-forward push not applicable (diverged history); attempting direct merge and push into dev..."
          git checkout -B dev origin/dev
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge origin/main --no-edit -m "chore(auto): sync main → dev after release [skip ci]" 2>/dev/null && git push origin dev 2>/dev/null; then
            echo "dev merged and pushed directly to origin/dev. Lockstep achieved without PR overhead."
            exit 0
          fi

          git merge --abort 2>/dev/null || true
          echo "Direct merge/push was rejected or encountered conflicts; falling back to automated PR sync..."

          gh label create "auto-sync" --description "Automated sync PRs" --color "0e8a16" --force 2>/dev/null || true

          # Reuse an open sync PR if one exists, otherwise create it.
          PR_NUMBER=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr create \
              --base dev \
              --head main \
              --title "chore(auto): sync main → dev after release" \
              --label "auto-sync" \
              --body-file - << 'EOF'
          Automated pull request bringing upstream `main` changes (semantic-release version bumps, `CHANGELOG.md`) back into `dev`.

          Auto-merged by the "Sync main to dev" workflow to keep `main` and `dev` in lockstep after every release.
          EOF
            )
          fi

          # Attempt immediate merge first (with admin bypass if available, or direct merge).
          # The release commits on main already passed full CI before release,
          # so waiting on auto-merge checks is unnecessary and risks deadlocking on skipped checks.
          for i in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --admin --merge 2>/dev/null || gh pr merge "$PR_NUMBER" --merge 2>/dev/null; then
              echo "Sync PR #$PR_NUMBER merged immediately. dev is in lockstep with main."
              exit 0
            fi
            echo "Direct merge attempt $i failed (mergeability computing or checks required); retrying in 5s..."
            sleep 5
          done

          # Fallback: if immediate merge was blocked (e.g. strict ruleset without admin bypass),
          # set auto-merge so it can merge once satisfied.
          if gh pr merge "$PR_NUMBER" --auto --merge 2>/dev/null; then
            echo "Sync PR #$PR_NUMBER set to auto-merge fallback."
            exit 0
          fi

          echo "::warning::Sync PR #$PR_NUMBER could not be merged automatically. Leaving it open for manual merge."
          exit 1