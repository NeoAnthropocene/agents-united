name: "💡 Feature or Enhancement Request"
description: Propose a new feature, CLI command, projection target, or architectural improvement.
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Agents United!
        
        Before submitting:
        - Check existing issues and discussions to avoid duplicate requests.
        - Review existing [Architectural Decision Records (ADRs)](https://github.com/NeoAnthropocene/agents-united/tree/dev/docs/adr) to ensure alignment with architectural contracts and host conformance targets.

  - type: dropdown
    id: subsystem
    attributes:
      label: Target Subsystem / Area
      description: Which area of Agents United does this enhancement relate to?
      options:
        - "CLI & TUI Wizard (src/cli.ts, @clack/prompts, interactive UX)"
        - "Host Projection Engine (src/core/projector.ts, cline-projector.ts, AGENTS.md bridge)"
        - "Doctor & Diagnostics (src/core/doctor.ts, schema & hook validation)"
        - "Installer, Uninstaller & Lockfile (src/core/installer.ts, uninstaller.ts, lockfile)"
        - "Inventory & Update Engine (src/core/inventory.ts, updater.ts, drift detection)"
        - "Continuous Evaluation Harness (tests/e2e-evals/, stream-json judge & gatekeeper)"
        - "MCP Prerequisite Engine & Registry (src/core/prerequisites.ts, mcp-locations.ts)"
        - "Cross-Host Activation & Launcher (src/core/cline-launcher.ts, cline-capabilities.ts)"
        - "Developer Experience, CI/CD, Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a specific problem or friction point?
      placeholder: "A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Behavior
      description: Describe the solution or new capability you would like to see.
      placeholder: "Provide concrete details, CLI flags (e.g., `agents add --flag`), or workflow improvements."
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, temporary workarounds, or fallback approaches you considered.
      placeholder: "e.g., We could alternatively handle this by [...]"
    validations:
      required: false

  - type: dropdown
    id: breaking_change
    attributes:
      label: Backwards Compatibility & ADR Impact
      description: Does this proposal introduce any breaking changes or require a new ADR?
      options:
        - "No breaking changes — purely additive"
        - "Requires minor configuration or frontmatter schema update"
        - "Potential breaking change — requires an Architectural Decision Record (ADR)"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor Checklist
      options:
        - label: "I have searched existing issues and discussions for similar requests."
          required: true
        - label: "This proposal adheres to the core philosophy (Essentials-first, zero-trust, canonical .agents/ store)."
          required: true
        - label: "I am interested in contributing or testing this implementation."
          required: false
