<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 288px; position: relative; overflow: hidden; background: var(--cream-50); font-family: var(--font-base); }
  svg { position: absolute; inset: 0; }
  .ground { fill: var(--cream-50); }
  .clay { fill: var(--clay-600); }
  .cocoa { fill: var(--cocoa-900); }
  .cocoa-soft { fill: var(--cocoa-600); }
  .sand { fill: var(--sand-300); }
  .cut { fill: var(--cream-50); }
  .tile { rx: var(--radius-md); }
  .text { position: absolute; left: 32px; bottom: 32px; width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .95; font-weight: 700; color: var(--text-default); }
  .tag { margin: 16px 0 0; font-size: 14px; line-height: 1.3; color: var(--text-muted); }
</style>
</head>
<body>
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <!--
  Blocks: cocoa-900 256x192 (space-8 x 4, x 3), clay-600 208x160 bleeding right, sand-300 and cocoa-600 pills 64 tall (space-8).
  Arrangement: a staggered stack from x=480; the cocoa slab bleeds off the top, clay bleeds off the right, two pills run beneath.
  Pattern: discs, because PetPal's only shape token beyond radius-md is radius-pill, so the system speaks in rounds; 12 cream discs at a 48px pitch cut out of the clay block.
  Steps and radii: space-8 (64), space-4 (32), space-2 (16); radius-md on the blocks, radius-pill (half the short side, 32) on the pills.
  -->
  <rect class="cocoa tile" x="480" y="-12" width="256" height="204"/>
  <rect class="clay tile" x="752" y="32" width="220" height="160"/>
  <rect class="sand" x="480" y="208" width="192" height="64" rx="32"/>
  <rect class="cocoa-soft" x="688" y="208" width="128" height="64" rx="32"/>
  <rect class="sand" x="832" y="208" width="140" height="64" rx="32"/>
  <g class="cut">
    <circle cx="792" cy="64" r="16"/><circle cx="840" cy="64" r="16"/><circle cx="888" cy="64" r="16"/><circle cx="936" cy="64" r="16"/>
    <circle cx="792" cy="112" r="16"/><circle cx="840" cy="112" r="16"/><circle cx="888" cy="112" r="16"/><circle cx="936" cy="112" r="16"/>
    <circle cx="792" cy="160" r="16"/><circle cx="840" cy="160" r="16"/><circle cx="888" cy="160" r="16"/><circle cx="936" cy="160" r="16"/>
  </g>
</svg>
<div class="text">
  <h1 class="name">PetPal</h1>
  <p class="tag">A fictional pet product, used for design system practice.</p>
</div>
</body>
</html>
