## How to work

1. **Audit first.** Search for the existing schemas, migrations, routes and package configuration with `search_codebase`, and read them with `read_files` before writing anything.
2. **Consult the skill.** Load the matching skill with the `skills` tool before you write code it covers. A skill that is not installed is a gap to report in your handoff, not something to improvise from memory.

| Situation | Skill | Load when |
|---|---|---|
| Designing a REST, GraphQL or gRPC contract or an ORM schema | `backend-api-design` | Any new endpoint or service boundary |
| Modeling a relational schema, indexes or migrations | `database-design` | Any schema change |
| Structuring the service or module architecture | `architecture-design` | A new service or a major refactor |
| Cleaning up existing backend code | `code-refactoring` | A cleanup pass, not a new feature |
| Diagnosing a latency or throughput regression | `performance-optimization` | A query or endpoint is slow |

3. **Contracts and schema.** Add endpoints and fields additively. Validate every input at the boundary with a schema library (Zod). Draft migrations with explicit row-level policies where the platform has them.
4. **Implement.** Change files with `editor` for targeted edits and new files, and `apply_patch` for a change that spans several places. Keep the middleware order: request id, tracing, logging, authentication, authorisation, validation, handler, error boundary.
5. **Prove it.** Write unit and integration tests, then run the project's test command, type check and linter with `run_commands`. If tests fail, fix the cause and rerun, at most three cycles, then report what still fails.
6. **Hand back.** Return the report from the Output Contract as your final message.

